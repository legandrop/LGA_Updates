name: Refresh versions manifest

# Cada 30 minutos regenera versions.json contra los repos de release de repos.json.
#
# Por que un cron aca y no un disparo desde cada repo de release: disparar desde cada uno
# obligaria a agregarle un workflow a los diez repos y a que ninguno se lo olvide nunca.
# Dado vuelta, los repos de release no se enteran de que esto existe y sumar un producto es
# editar un solo archivo en un solo lugar.
#
# OJO — GitHub apaga los workflows programados despues de 60 dias sin actividad en el repo,
# y avisa por mail al owner. Si el manifiesto deja de actualizarse, mirar primero si el cron
# sigue habilitado en la pestana Actions; se reactiva con un click o corriendo este workflow
# a mano desde "Run workflow".

on:
  schedule:
    # Cada 30 min. GitHub no garantiza puntualidad en los crons y puede demorar varios
    # minutos con la cola cargada: la ventana real de propagacion de un release nuevo es de
    # ~30-45 min, mas el cache del CDN de Pages.
    - cron: '*/30 * * * *'
  # Para publicar un release sin esperar al cron.
  workflow_dispatch:

permissions:
  contents: write

# Dos corridas pisandose escribirian el mismo archivo y una de las dos perderia el push.
concurrency:
  group: refresh-versions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar versions.json
        env:
          # El token que GitHub le da al workflow. Alcanza para leer los releases de repos
          # PUBLICOS de cualquier owner; no llega a los privados, y eso es a proposito: asi
          # este workflow no necesita ningun secret cargado a mano.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build_manifest.sh
          ./build_manifest.sh

      - name: Commitear si cambio o si toca latido
        run: |
          # Se commitea por DOS motivos, y solo por esos:
          #
          #  1. Cambio alguna version. Es el caso util.
          #  2. El `checkedAt` publicado ya tiene mas de 20 h. Es el LATIDO: sin el, un manifiesto
          #     que no cambia es indistinguible de un workflow que dejo de correr, y las apps no
          #     tendrian con que avisar. Se refresca a lo sumo una vez por dia — hacerlo en cada
          #     corrida dejaria 48 commits diarios sin ninguna informacion adentro.
          #
          # OJO: el commit diario NO se puede dar por bueno como forma de mantener vivo el cron.
          # GitHub apaga los workflows programados tras 60 dias de inactividad en el repo, pero
          # los commits pusheados con el `GITHUB_TOKEN` se reportan ampliamente como NO
          # contabilizados para ese corte —de ahi que se use un PAT cuando se quiere ese efecto—.
          # Sin verificar, asi que el backstop de verdad es el aviso del lado de la app, que
          # detecta el latido frio sin importar por que se corto.
          COMMIT_MSG="Versions - Actualizacion automatica del manifiesto"
          if [ -f versions.json ] && git show HEAD:versions.json > /tmp/prev.json 2>/dev/null; then
            CONTENT_CHANGED=1
            if diff -q \
              <(jq -S '{products, missing}' /tmp/prev.json) \
              <(jq -S '{products, missing}' versions.json) > /dev/null; then
              CONTENT_CHANGED=0
            fi

            HEARTBEAT_DUE=1
            PREV_CHECKED="$(jq -r '.checkedAt // ""' /tmp/prev.json)"
            if [ -n "$PREV_CHECKED" ]; then
              PREV_EPOCH="$(date -u -d "$PREV_CHECKED" +%s 2>/dev/null || echo 0)"
              NOW_EPOCH="$(date -u +%s)"
              # 72000 s = 20 h. Menos que 24 para que el latido no se corra de a poco cada dia
              # hasta cruzar el limite y saltear una jornada entera.
              if [ "$PREV_EPOCH" -gt 0 ] && [ "$((NOW_EPOCH - PREV_EPOCH))" -lt 72000 ]; then
                HEARTBEAT_DUE=0
              elif [ "$PREV_EPOCH" -eq 0 ]; then
                # Si la fecha publicada no parsea, el latido queda "vencido" en TODAS las
                # corridas: 48 commits por dia. No es silencioso, pero sin este aviso habria que
                # deducirlo del historial. Se loguea para que se vea en la corrida misma.
                echo "AVISO: no se pudo parsear el checkedAt publicado ('$PREV_CHECKED'). Se va a commitear en cada corrida hasta que se arregle."
              fi
            fi

            if [ "$CONTENT_CHANGED" -eq 0 ] && [ "$HEARTBEAT_DUE" -eq 0 ]; then
              echo "Sin cambios de version y el latido sigue fresco. No se commitea."
              exit 0
            fi
            if [ "$CONTENT_CHANGED" -eq 0 ]; then
              COMMIT_MSG="Versions - Latido del manifiesto"
            fi
          fi
          git config user.name "legandrop"
          git config user.email "176236735+legandrop@users.noreply.github.com"
          git add versions.json
          git commit -m "$COMMIT_MSG"
          git push
